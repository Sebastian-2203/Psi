name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    env:
      # Placeholder values so the build does not need real secrets.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate per-run session activity secret
        run: |
          SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$SECRET"
          echo "SESSION_ACTIVITY_SECRET=$SECRET" >> "$GITHUB_ENV"
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm i18n:check
      - run: pnpm test
      - run: pnpm build

  # Local Supabase stack: migrations from scratch, pgTAP RLS suite, integration tests
  # (real persona JWTs, ADR-019 Option A data path, Data API closed), types drift check.
  supabase:
    runs-on: ubuntu-latest
    env:
      APP_BASE_DOMAIN: localhost
      REQUIRE_LOCAL_STACK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate per-run session activity secret
        run: |
          SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$SECRET"
          echo "SESSION_ACTIVITY_SECRET=$SECRET" >> "$GITHUB_ENV"
      - run: pnpm db:start
      - name: Export local stack env (well-known local demo keys + random app_server password)
        run: |
          eval "$(pnpm exec supabase status -o env)"
          APP_DB_PASSWORD="$(node -e "console.log(require('node:crypto').randomBytes(24).toString('base64url'))")"
          echo "::add-mask::$APP_DB_PASSWORD"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SECRET_KEY"
            echo "APP_DB_PASSWORD=$APP_DB_PASSWORD"
            echo "DATABASE_URL=postgresql://app_server:$APP_DB_PASSWORD@127.0.0.1:54322/postgres"
          } >> "$GITHUB_ENV"
      - run: pnpm db:reset # migrations from scratch + fictional seed + app_server password
      - run: pnpm db:test # pgTAP
      - run: pnpm test:integration # Vitest integration + node projects against the stack
      - name: Generated DB types are up to date
        run: pnpm gen:types && git diff --exit-code src/server/db/types.gen.ts

  # Playwright E2E against the local Supabase stack (Auth, Postgres, Mailpit for email links) and a
  # production build of the app (playwright.config.ts starts `pnpm build && pnpm start`).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_BASE_DOMAIN: localhost
      REQUIRE_LOCAL_STACK: '1'
      MAIL_DEV_HTTP_URL: http://127.0.0.1:54324
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate per-run session activity secret
        run: |
          SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$SECRET"
          echo "SESSION_ACTIVITY_SECRET=$SECRET" >> "$GITHUB_ENV"
      - run: pnpm db:start
      - name: Export local stack env (well-known local demo keys + random app_server password)
        run: |
          eval "$(pnpm exec supabase status -o env)"
          APP_DB_PASSWORD="$(node -e "console.log(require('node:crypto').randomBytes(24).toString('base64url'))")"
          echo "::add-mask::$APP_DB_PASSWORD"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SECRET_KEY"
            echo "APP_DB_PASSWORD=$APP_DB_PASSWORD"
            echo "DATABASE_URL=postgresql://app_server:$APP_DB_PASSWORD@127.0.0.1:54322/postgres"
          } >> "$GITHUB_ENV"
      - run: pnpm db:reset
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
